name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v1.0.0'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # App token instead of GITHUB_TOKEN: its PRs trigger ci without the
      # action_required approval gate, and its merge push re-triggers this
      # workflow so the release+publish chain still fires.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: 4400226
          private-key: ${{ secrets.AUTOMATED_RELEASES_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Requires the main ruleset (go+docker checks): GitHub only accepts
      # --auto on a PR whose merge is blocked by protection requirements.
      - name: Arm auto-merge on the release PR
        if: ${{ steps.rp.outputs.pr }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --squash --auto "${{ fromJSON(steps.rp.outputs.pr).number }}" -R "${{ github.repository }}"

  publish:
    needs: [release-please]
    if: always() && (needs.release-please.outputs.release_created == 'true' || inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - run: echo "TAG=${{ inputs.tag != '' && inputs.tag || needs.release-please.outputs.tag_name }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/avargaskun/ladder
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ env.TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
